name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        run: |
          S="${GITHUB_SHA::7}"; V="${{ github.run_number }}"
          printf '\nwindow.APP_VERSION="%s"; window.APP_COMMIT="%s";\n' "$V" "$S" >> frontend/config.js
          printf '{"version":"%s","commit":"%s"}\n' "$V" "$S" > frontend/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
