<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Agent">
<title>Pocket Agent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- setup / login -->
  <section id="setup" class="screen" hidden>
    <div class="setup-card">
      <div class="logo">&gt;_</div>
      <h1>Pocket Agent</h1>
      <p class="dim">Your own coding agent. Connect it to your server.</p>
      <label>Server URL
        <input id="in-url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://your-app.onrender.com">
      </label>
      <label>Password
        <input id="in-pw" type="password" autocomplete="current-password" placeholder="APP_PASSWORD from Render">
      </label>
      <button id="btn-connect" class="primary">Connect</button>
      <p id="setup-status" class="status"></p>
    </div>
  </section>

  <!-- main -->
  <section id="main" class="screen" hidden>
    <header>
      <button id="btn-menu" class="icon" aria-label="Chats">☰</button>
      <div class="title-wrap">
        <div id="title" class="title">Pocket Agent</div>
        <div id="subtitle" class="subtitle"></div>
      </div>
      <button id="chip-model" class="chip" aria-label="Model">model</button>
      <button id="chip-mode" class="chip mode-ask" aria-label="Permission mode">ask</button>
      <button id="btn-more" class="icon" aria-label="More">⋯</button>
    </header>

    <main id="chat" tabindex="-1">
      <div id="empty" class="empty">
        <div class="logo big">&gt;_</div>
        <h2>What are we building?</h2>
        <p class="dim">Ask me to write code, fix bugs, research something, or work in a GitHub repo.</p>
        <button id="btn-empty-new" class="primary">New chat</button>
      </div>
      <div id="msgs"></div>
    </main>
    <button id="btn-jump" class="jump" hidden aria-label="Jump to latest">↓</button>

    <div id="todobar" class="todobar" hidden></div>
    <div id="slashbox" class="slashbox" hidden></div>
    <footer>
      <div id="attach-preview" class="attach-preview" hidden></div>
      <div class="composer">
        <button id="btn-attach" class="icon" aria-label="Attach image">＋</button>
        <textarea id="input" rows="1" placeholder="Message the agent…" enterkeyhint="send"></textarea>
        <button id="btn-send" class="send" aria-label="Send">↑</button>
      </div>
      <input id="file-img" type="file" accept="image/*" hidden>
    </footer>
  </section>

  <!-- drawer -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title">Chats</div>
      <button id="btn-new" class="primary small">＋ New</button>
    </div>
    <input id="chat-search" class="search" placeholder="Search chats" autocomplete="off">
    <div id="chat-list" class="chat-list"></div>
  </aside>

  <!-- bottom sheet -->
  <div id="sheet-scrim" class="scrim" hidden></div>
  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-grab"></div>
    <div class="sheet-head"><div id="sheet-title"></div><button id="sheet-close" class="icon" aria-label="Close">✕</button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>

  <div id="toasts" class="toasts"></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
